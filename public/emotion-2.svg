<svg width="25" height="21" viewBox="0 0 25 21" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes floatBody {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-1.2px) scale(1.02); }
  }
  @keyframes eyeBlink {
    0%, 90%, 100% { transform: scaleY(1); opacity: 1; }
    95% { transform: scaleY(0.1); opacity: 0.5; }
  }
  @keyframes mouthTalk {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.6) translateY(0.3px); }
  }
  .body-group {
    animation: floatBody 3s ease-in-out infinite;
    transform-origin: center;
  }
  .blink-eye {
    animation: eyeBlink 4s infinite;
    transform-origin: 9.5px 9.8px;
  }
  .mouth-move {
    animation: mouthTalk 0.8s ease-in-out infinite;
    transform-origin: 10.8px 14px;
  }
</style>
